<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Landing Page Tailwind CSS</title>
	<link rel="stylesheet" href="../public/css/output.css">
</head>
<body>
	<!-- header start -->
	<header class="absolute w-full top-0">
		<div class="container mx-auto">
			<div class="flex justify-between items-center relative">
				<div class="px-4">
					<a href="home.html" class="font-bold text-xl text-sky-800 block py-6">Quizzy!</a>
				</div>
				<div class="flex items-center px-4">
					<button id="hamburger" name="hamburger" type="button" class="block absolute right-4 md:hidden">
						<span class="hamburger-line transition duration-200 ease-in-out origin-top-left"></span>
						<span class="hamburger-line transition duration-200 ease-in-out"></span>
						<span class="hamburger-line transition duration-200 ease-in-out origin-bottom-left"></span>
					</button>
					
					<nav id="nav-menu" class="">
						<ul class="flex gap-2">
							<li class="group border border-blue-600 rounded-lg">
								<a href="home.html" class="font-medium text-center text-blue-600 px-8 py-2 flex group-hover:bg-blue-600 duration-300 group-hover:text-white">Home</a>
							</li>
							<li class="group border border-blue-600 rounded-lg">
								<a href="history.html" class="font-medium text-center text-blue-600 px-8 py-2 flex group-hover:bg-blue-600 duration-300 group-hover:text-white">History</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</header>
	<!-- header end -->
	
	<!-- hero section start -->
	<section id="home" class="bg-gradient-to-b from-sky-300 to-sky-100">
		<div class="container mx-auto">
			<div class="flex flex-wrap flex-col md:flex-row items-center justify-center gap-12 md:gap-0 min-h-screen">
				<div class="w-full max-auto md:w-1/2 text-center relative">
					<h1 class="text-4xl md:text-5xl font-bold mb-6 text-slate-800">Silahkan pilih!</h1>
					<p id="subtitle" class="text-slate-800 text-sm md:text-base mb-8">Pilih mode yang kamu inginkan!</p>
				
					<ul id="chooseCategory" class="grid gap-2 px-8 md:px-0">
						<input type="hidden" name="type" id="type" value="base">
						<li>
							<input type="radio" id="flashcard" name="choice" value="flashcard" class="opacity-0 absolute peer" />
							<label for="flashcard" class="inline-flex items-center justify-between w-full py-3 text-gray-500 bg-transparent border border-blue-600 rounded-lg cursor-pointer peer-checked:border-blue-600 peer-checked:bg-blue-600 peer-checked:text-white hover:text-gray-600 hover:bg-blue-400">                           
								<div class="w-full text-center text-lg font-semibold">
									flashcard
								</div>
							</label>
						</li>
						<li>
							<input type="radio" id="random" name="choice" value="random" class="opacity-0 absolute peer" >
							<label for="random" class="inline-flex items-center justify-between w-full py-3 text-gray-500 bg-transparent border border-blue-600 rounded-lg cursor-pointer peer-checked:border-blue-600 peer-checked:bg-blue-600 peer-checked:text-white hover:text-gray-600 hover:bg-blue-400">
								<div class="w-full text-center text-lg font-semibold">
									random
								</div>
							</label>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</section>
	<!-- hero section end -->

  <button onclick="checkCategory()" id="submitButton" class="absolute bottom-2 left-2 right-2 md:width-40 bg-blue-600 text-white font-bold py-4 text-center rounded-lg shadow-lg backdrop-blur cursor-pointer">Mulai</button>
	<script src="../public/js/start.js"></script>
</body>
</html>
